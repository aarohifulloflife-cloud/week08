name: 05 - Validate Monitoring

# Deploying Prometheus is not the same as Prometheus working. Pods can
# be Running while every scrape target is down, and the dashboards then
# render empty with no error. Runs after the staging smoke test.

on:
  workflow_run:
    workflows: ["03 - Test Staging"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  validate-monitoring:
    name: Validate Prometheus and Grafana
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ vars.AKS_RESOURCE_GROUP }} \
            --name ${{ vars.AKS_CLUSTER_NAME }} \
            --overwrite-existing

      - name: Confirm monitoring components are running
        run: |
          kubectl get pods -n monitoring
          kubectl wait --for=condition=ready pod \
            -l app.kubernetes.io/name=grafana \
            -n monitoring --timeout=300s

      # node-exporter is a DaemonSet: pod count should equal node count.
      - name: Confirm every node is reporting metrics
        run: |
          NODES=$(kubectl get nodes --no-headers | wc -l)
          EXPORTERS=$(kubectl get pods -n monitoring \
            -l app.kubernetes.io/name=prometheus-node-exporter \
            --no-headers | wc -l)
          echo "Nodes: $NODES, node-exporter pods: $EXPORTERS"
          if [ "$NODES" -ne "$EXPORTERS" ]; then
            echo "Not every node is reporting metrics"
            exit 1
          fi

      - name: Confirm Prometheus is collecting metrics
        run: |
          kubectl port-forward -n monitoring svc/prometheus-operated 9090:9090 &
          sleep 15
          UP=$(curl -s "http://localhost:9090/api/v1/query?query=count(up==1)" \
            | grep -o '"value":\[[^]]*\]' \
            | grep -oE '"[0-9]+"\]$' | tr -d '"]')
          echo "Healthy scrape targets: ${UP:-0}"
          if [ -z "$UP" ] || [ "$UP" -lt 1 ]; then
            echo "Prometheus has no healthy scrape targets"
            exit 1
          fi
          curl -s "http://localhost:9090/api/v1/query?query=kube_pod_status_phase%7Bnamespace%3D%22staging%22%7D" | head -c 800
          echo ""
