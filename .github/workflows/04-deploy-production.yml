name: 04 - Deploy to Production

on:
  # CONTINUOUS DEPLOYMENT
  # Chains automatically from the staging smoke test. Once staging is
  # validated, production follows with no human decision point.
  workflow_run:
    workflows:
      - "03 - Test Staging"
    types:
      - completed
    branches:
      - main

  # Retained as an escape hatch for redeploying a specific known-good
  # SHA without pushing a commit.
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Tested image SHA to deploy"
        required: true
        type: string

jobs:
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest

    # workflow_run fires on completion regardless of outcome, so the
    # conclusion must be checked explicitly. Without this a failed
    # staging test would still promote to production.
    if: >
      ${{ github.event_name == 'workflow_dispatch' ||
          github.event.workflow_run.conclusion == 'success' }}

    environment:
      name: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The image tag comes from a different place depending on how the
      # workflow started, so resolve it once here rather than repeating
      # the conditional on every kubectl set image step.
      - name: Resolve image tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_TAG: ${{ inputs.image_tag }}
          CHAINED_TAG: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$MANUAL_TAG"
            echo "Manual promotion of $TAG"
          else
            TAG="$CHAINED_TAG"
            echo "Automatic promotion of $TAG from staging"
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Login to Azure
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ vars.AKS_RESOURCE_GROUP }} \
            --name ${{ vars.AKS_CLUSTER_NAME }} \
            --overwrite-existing

      - name: Create production namespace
        run: |
          kubectl create namespace production \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      - name: Create PostgreSQL secret
        run: |
          kubectl create secret generic postgres-secret \
            --namespace production \
            --from-literal=POSTGRES_USER="${{ secrets.POSTGRES_USER }}" \
            --from-literal=POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}" \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      - name: Create application secret
        run: |
          kubectl create secret generic application-secret \
            --namespace production \
            --from-literal=POSTGRES_USER="${{ secrets.POSTGRES_USER }}" \
            --from-literal=POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}" \
            --from-literal=JWT_SECRET_KEY="${{ secrets.JWT_SECRET_KEY }}" \
            --from-literal=DEFAULT_ADMIN_USERNAME="${{ secrets.DEFAULT_ADMIN_USERNAME }}" \
            --from-literal=DEFAULT_ADMIN_EMAIL="${{ secrets.DEFAULT_ADMIN_EMAIL }}" \
            --from-literal=DEFAULT_ADMIN_PASSWORD="${{ secrets.DEFAULT_ADMIN_PASSWORD }}" \
            --from-literal=AZURE_STORAGE_CONNECTION_STRING="${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}" \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply \
            -f kubernetes/production/

      - name: Update frontend image
        run: |
          kubectl set image deployment/frontend \
            frontend=${{ vars.ACR_LOGIN_SERVER }}/koalatech-frontend:${{ steps.tag.outputs.tag }} \
            -n production

      - name: Update user-service image
        run: |
          kubectl set image deployment/user-service \
            user-service=${{ vars.ACR_LOGIN_SERVER }}/koalatech-user-service:${{ steps.tag.outputs.tag }} \
            -n production

      - name: Update student-service image
        run: |
          kubectl set image deployment/student-service \
            student-service=${{ vars.ACR_LOGIN_SERVER }}/koalatech-student-service:${{ steps.tag.outputs.tag }} \
            -n production

      - name: Update lecturer-service image
        run: |
          kubectl set image deployment/lecturer-service \
            lecturer-service=${{ vars.ACR_LOGIN_SERVER }}/koalatech-lecturer-service:${{ steps.tag.outputs.tag }} \
            -n production

      - name: Update course-service image
        run: |
          kubectl set image deployment/course-service \
            course-service=${{ vars.ACR_LOGIN_SERVER }}/koalatech-course-service:${{ steps.tag.outputs.tag }} \
            -n production

      - name: Update enrollment-service image
        run: |
          kubectl set image deployment/enrollment-service \
            enrollment-service=${{ vars.ACR_LOGIN_SERVER }}/koalatech-enrollment-service:${{ steps.tag.outputs.tag }} \
            -n production

      - name: Wait for frontend rollout
        run: |
          kubectl rollout status deployment/frontend \
            -n production \
            --timeout=300s

      - name: Wait for user-service rollout
        run: |
          kubectl rollout status deployment/user-service \
            -n production \
            --timeout=300s

      - name: Wait for student-service rollout
        run: |
          kubectl rollout status deployment/student-service \
            -n production \
            --timeout=300s

      - name: Wait for lecturer-service rollout
        run: |
          kubectl rollout status deployment/lecturer-service \
            -n production \
            --timeout=300s

      - name: Wait for course-service rollout
        run: |
          kubectl rollout status deployment/course-service \
            -n production \
            --timeout=300s

      - name: Wait for enrollment-service rollout
        run: |
          kubectl rollout status deployment/enrollment-service \
            -n production \
            --timeout=300s

      - name: Show production resources
        run: |
          kubectl get pods -n production
          kubectl get services -n production
          kubectl get pvc -n production